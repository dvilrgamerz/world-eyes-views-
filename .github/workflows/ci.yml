name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check browser JavaScript syntax
        run: node --check src/app.js
      - name: Check serverless function syntax
        run: |
          node --check netlify/functions/news.mjs
          node --check netlify/functions/flights.mjs
          node --check netlify/functions/satellites.mjs
          node --check netlify/functions/quakes.mjs
          node --check netlify/functions/trade.mjs
